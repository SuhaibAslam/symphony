<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Cognitive Harness architecture</title>
  <desc id="desc">A layered architecture diagram showing Symphony primitives, Cognitive Harness workspace semantics, generated artifacts, and challenge areas.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#eef3f7"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1f2933" flood-opacity="0.13"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .eyebrow { fill: #647181; font-size: 13px; font-weight: 700; letter-spacing: 1.4px; }
      .title { fill: #111827; font-size: 34px; font-weight: 760; }
      .subtitle { fill: #4b5563; font-size: 17px; }
      .panel-title { fill: #111827; font-size: 20px; font-weight: 740; }
      .label { fill: #253142; font-size: 14px; font-weight: 690; }
      .body { fill: #46515f; font-size: 13px; }
      .chip { fill: #374151; font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="780" fill="url(#paper)"/>
  <rect x="48" y="44" width="1104" height="692" rx="28" fill="#ffffff" stroke="#d9dee5" filter="url(#shadow)"/>

  <text x="88" y="102" class="eyebrow">SYMPHONY EXTENSION PATTERN</text>
  <text x="88" y="144" class="title">Cognitive Harness</text>
  <text x="88" y="176" class="subtitle">A workspace layer for inquiry state, rationale, reflection, and continuation.</text>

  <g transform="translate(88 238)">
    <rect x="0" y="0" width="286" height="318" rx="18" fill="#f5f7fb" stroke="#cad2de"/>
    <text x="24" y="44" class="panel-title">Symphony substrate</text>
    <text x="24" y="74" class="body">Execution primitives already exist.</text>
    <g transform="translate(24 108)">
      <rect width="238" height="38" rx="19" fill="#ffffff" stroke="#d9dee5"/>
      <text x="18" y="24" class="label">Workspace isolation</text>
      <rect y="52" width="238" height="38" rx="19" fill="#ffffff" stroke="#d9dee5"/>
      <text x="18" y="76" class="label">Lifecycle hooks</text>
      <rect y="104" width="238" height="38" rx="19" fill="#ffffff" stroke="#d9dee5"/>
      <text x="18" y="128" class="label">Retries</text>
      <rect y="156" width="238" height="38" rx="19" fill="#ffffff" stroke="#d9dee5"/>
      <text x="18" y="180" class="label">Review artifacts</text>
    </g>
  </g>

  <g transform="translate(456 198)">
    <rect x="0" y="0" width="288" height="410" rx="22" fill="#141b2d"/>
    <text x="28" y="48" fill="#d9e6ff" font-size="13" font-weight="760" letter-spacing="1.2px">COGNITIVE HARNESS</text>
    <text x="28" y="86" fill="#ffffff" font-size="24" font-weight="780">Workspace semantics</text>
    <text x="28" y="120" fill="#b7c4d8" font-size="14">The layer that gives a run</text>
    <text x="28" y="142" fill="#b7c4d8" font-size="14">structure beyond execution.</text>
    <g transform="translate(28 178)">
      <rect width="232" height="40" rx="12" fill="#24314c"/>
      <text x="16" y="25" fill="#eef4ff" font-size="13" font-weight="700">Bounded inquiry</text>
      <rect y="54" width="232" height="40" rx="12" fill="#24314c"/>
      <text x="16" y="79" fill="#eef4ff" font-size="13" font-weight="700">Workspace constitution</text>
      <rect y="108" width="232" height="40" rx="12" fill="#24314c"/>
      <text x="16" y="133" fill="#eef4ff" font-size="13" font-weight="700">Reasoning archetypes</text>
      <rect y="162" width="232" height="40" rx="12" fill="#24314c"/>
      <text x="16" y="187" fill="#eef4ff" font-size="13" font-weight="700">Reflection policy</text>
    </g>
  </g>

  <g transform="translate(826 238)">
    <rect x="0" y="0" width="286" height="318" rx="18" fill="#f7f2e8" stroke="#dfcda7"/>
    <text x="24" y="44" class="panel-title">Generated artifacts</text>
    <text x="24" y="74" class="body">Concrete files a reviewer can inspect.</text>
    <g transform="translate(24 108)">
      <rect width="238" height="38" rx="10" fill="#ffffff" stroke="#dfd2b7"/>
      <text x="16" y="24" class="label">COGNITIVE_STATE.json</text>
      <rect y="52" width="238" height="38" rx="10" fill="#ffffff" stroke="#dfd2b7"/>
      <text x="16" y="76" class="label">RATIONALE_GRAPH.json</text>
      <rect y="104" width="238" height="38" rx="10" fill="#ffffff" stroke="#dfd2b7"/>
      <text x="16" y="128" class="label">REFLECTION_REPORT.md</text>
      <rect y="156" width="238" height="38" rx="10" fill="#ffffff" stroke="#dfd2b7"/>
      <text x="16" y="180" class="label">CONTINUATION_PROMPT.md</text>
    </g>
  </g>

  <path d="M374 397 C402 397 428 397 456 397" stroke="#9aa5b1" stroke-width="2.4" fill="none"/>
  <path d="M744 397 C772 397 798 397 826 397" stroke="#9aa5b1" stroke-width="2.4" fill="none"/>

  <g transform="translate(88 634)">
    <rect width="1024" height="72" rx="18" fill="#f8fafc" stroke="#d9dee5"/>
    <text x="24" y="30" class="label">Challenge areas</text>
    <g transform="translate(170 20)">
      <rect width="118" height="32" rx="16" fill="#ffffff" stroke="#d9dee5"/>
      <text x="24" y="21" class="chip">Continuity</text>
      <rect x="136" width="142" height="32" rx="16" fill="#ffffff" stroke="#d9dee5"/>
      <text x="158" y="21" class="chip">Tension tracking</text>
      <rect x="296" width="136" height="32" rx="16" fill="#ffffff" stroke="#d9dee5"/>
      <text x="318" y="21" class="chip">Epistemic review</text>
      <rect x="450" width="104" height="32" rx="16" fill="#ffffff" stroke="#d9dee5"/>
      <text x="478" y="21" class="chip">Recovery</text>
      <rect x="572" width="118" height="32" rx="16" fill="#ffffff" stroke="#d9dee5"/>
      <text x="598" y="21" class="chip">Adaptation</text>
    </g>
  </g>
</svg>
